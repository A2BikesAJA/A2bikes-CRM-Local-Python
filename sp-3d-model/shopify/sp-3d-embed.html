<!-- A2 Bikes — SP interactive 3D viewer
     Paste into any Shopify page/product description via "Edit as HTML",
     or use sections/sp-3d-viewer.liquid in the theme for a customizer block. -->
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<model-viewer
    src="https://cdn.shopify.com/s/files/1/2232/8463/files/sp_final.glb"
    alt="A2 Bikes SP triathlon bike — interactive 3D model, matte black"
    style="width:100%;height:70vh;min-height:420px;background:#f4f4f5;border-radius:8px;--progress-bar-color:#EB1C2D;"
    camera-controls
    auto-rotate
    auto-rotate-delay="1500"
    rotation-per-second="20deg"
    interaction-prompt="when-focused"
    shadow-intensity="1"
    shadow-softness="0.8"
    exposure="1.05"
    environment-image="neutral"
    ar ar-modes="webxr scene-viewer quick-look">
</model-viewer>
<p style="text-align:center;color:#7D858C;font-size:14px;">Drag to spin &middot; pinch or scroll to zoom &middot; tap the AR icon on mobile to see the SP in your space</p>
